# AuditBench-DD E0 - CIFAR-10 external condensed-set source registry.
#
# Only official public sources are accepted. Source tiers (task-fixed order):
#   1 author project page release | 2 author official repo artifact
#   3 DC-BENCH official repo/package | 4 REPRODUCED with pinned commit
#   5 community mirror (requires pinned SHA-256 matching a tier 1-3 reference)
#
# Verification state machine (field `status`):
#   pending_url_verification -> human must confirm the official URL first
#   pending_fetch            -> URL registered, nothing downloaded yet
#   fetched/hash_verified/ingested -> set by the pipeline after each stage
#   rejected_*               -> set by the pipeline with a recorded reason
#
# `files` maps downloaded blobs to IPC explicitly; the pipeline refuses to
# infer method/IPC/seed from file or directory names. Empty `files` means the
# archive layout still has to be mapped by a human after the first download.
# Repo landing URLs below are registered from the authors' official pages as
# of 2026-09; per-file data URLs and SHA-256 are pinned at first fetch.
# 2026-09-05 (iter-0002): DC-BENCH repo URL corrected from
# github.com/justincui03/dcbench (HTTP 404) to
# github.com/justincui03/dc_benchmark, whose README (commit
# 2a57711961670859ea4c3102b766d1b16f7dea85) states it is the official
# codebase for the DC-BENCH paper (arXiv:2207.09639).

version: 1
dataset: cifar10

# Pre-frozen method_family taxonomy (E0 task). Values, not code, carry this.
taxonomy:
  - selection_family
  - gradient_family
  - distribution_family
  - trajectory_family
  - kernel_family
  - parameterization_family
  - attention_family
  - generative_family

