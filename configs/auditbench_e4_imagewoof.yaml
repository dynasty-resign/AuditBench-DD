# AuditBench-DD E4: pre-registered execution config for the ImageWoof external blind test
# of training-free proxy scores against hard-label student utility (cohort filled
# mechanically in iter-0007 under the two-phase lock; frozen protocol in
# runs/imagewoof/auditbench_e4/e4_preregistration.json, sha16 08db9ca9fa63067c).
#
# ExperimentConfig-compatible execution config for the E4 embedding backbone
# (Phase-1 two-stage, trained ONLY on official ImageWoof train at 64px, blind to all
# candidate sets) and for E4 smoke runs. All evaluation budget values are the
# E1/E2/E3 frozen values carried over unchanged.
experiment: imagewoof/auditbench_e4
seed: 0
device: auto
output_dir: runs

dataset:
  name: imagewoof
  root: data
  image_size: 64
  num_workers: 4
  download: false
  # iter-0007 T3 measured z-score pin on the official ImageWoof train split at the
  # frozen 64px evaluation resolution (float64 accumulation, full enumeration;
  # evidence runs/evidence_packs/iter0007_e4a/zscore_pin/zscore_pin.json). The
  # authoritative runtime values live in src/ttd/data.py DATASET_STATS['imagewoof'];
  # this comment block is the registry (E0/E2 lesson: never trust inherited
  # constants silently; DATASET_STATS had NO imagewoof entry before this round).
  # zscore_pin (comment block):
  #   mean: [0.486150, 0.455984, 0.393782]
  #   std: [0.247363, 0.239938, 0.249480]
  #   n_images: 9025, accumulation_dtype: float64, full enumeration
  #   measured_at_utc: 2026-09-07T23:56:02Z, constants_sha16: 664a45b68ed2eb03

backbone:
  # Phase-1 protocol isomorphic to E1/E2/E3; capacity/budget identical to the E3
  # 64px backbone (configs/tiny_imagenet.yaml). Trained on official ImageWoof train
  # only (post-download-authorization); never sees candidate artifacts.
  latent_channels: 16
  width: 96
  embed_dim: 256
  ae_epochs: 100
  diffusion_epochs: 200
  ae_lr: 0.0002
  diffusion_lr: 0.0002
  batch_size: 128
  checkpoint: runs/imagewoof/auditbench_e4/backbone.pt
  condition_dropout: 0.1
  semantic_weight: 0.1
  ema_decay: 0.999
  validation_fraction: 0.1
  validation_batches: 10
  noise_mse_target: 0.8
  use_ema: true

trajectory:
  diffusion_steps: 1000
  timesteps: [999, 749, 499, 249, 0]
  beta_start: 0.0001
  beta_end: 0.02
  space: latent
  direction: reverse
  conditioning: unconditional
  source: inversion
  representation: predicted_clean
  inference_steps: 100
  noise_repeats: 1

topology:
  max_points_per_class: 64
  signature_size: 32
  metric: cosine
  homology_dim: 0
  pairs_per_step: 4

distill:
  method: ttd
  ipc: 10
  steps: 2000
  lr: 0.05
  lambda_feature: 1.0
  lambda_topology: 1.0
  feature_covariance: true
  init: real
  log_every: 50

evaluation:
  # Frozen E4 student-training budget: identical to the E1/E2/E3 frozen values
  # (200ep / batch 128 / lr 0.1 / wd 5e-4 / seeds [0,1,2]); carried over unchanged
  # and not re-tunable in the formal E4 round. 64px convergence calibration clause:
  # see the pre-registration training_budget.convergence_calibration_clause.
  architectures: [convnet, resnet18, vgg11, mobilenet_v2]
  epochs: 200
  batch_size: 128
  lr: 0.1
  weight_decay: 0.0005
  seeds: [0, 1, 2]
  probe_views: 8
  probe_max_iter: 500

feasibility:
  sample_count: 10000
  train_fraction: 0.8
  split_seeds: [0, 1, 2, 3, 4]
  topology_neighbors: 16
  topology_jobs: 1
  dimension_matched_probe: true
  visualization_samples: 500
  exact_ph_max_dim: 1
  topology_curve_bins: 50