# AuditBench-DD E3: pre-registered design for the Tiny-ImageNet external blind test of
# training-free proxy scores against hard-label student utility on the DC-BENCH tier-3
# Tiny-ImageNet cohort (10 design entries / 14 measured entries with the TM replica
# expansion).
#
# ExperimentConfig-compatible execution config for the future E3 embedding backbone
# (Phase-1 two-stage, trained ONLY on official Tiny-ImageNet train, blind to all candidate
# sets) and for E3 smoke runs. All evaluation budget values are the E1/E2 frozen values
# carried over unchanged; the machine-readable frozen protocol lives in
# runs/tiny_imagenet/auditbench_e3/e3_preregistration.json (derived; frozen in the iter-0008
# design round before any download, any utility, and any 64px backbone retraining).
# iter-0008 executes NO training from this config: readiness checks are schema/shape only.
experiment: tiny_imagenet/auditbench_e3
seed: 0
device: auto
output_dir: runs

dataset:
  name: tiny_imagenet
  root: data
  image_size: 64
  num_workers: 4
  download: false
  # iter-0009 T2 measured z-score pin (n=100,000 official train images, float64
  # accumulation, full enumeration, measured 2026-09-06T04:15:26Z; evidence
  # runs/evidence_packs/iter0009/zscore_pin/zscore_pin.json, constants_sha16
  # bde6ba5274c84541). The authoritative runtime values live in
  # src/ttd/data.py DATASET_STATS['tiny_imagenet']; this block is the registry.
  # zscore_pin (comment block; machine-readable source of truth is
  # src/ttd/data.py DATASET_STATS['tiny_imagenet'] + the pin evidence JSON):
  #   mean: [0.480246, 0.448072, 0.397548]
  #   std: [0.276986, 0.269064, 0.282082]
  #   n_images: 100000, accumulation_dtype: float64
  #   measured_at_utc: 2026-09-06T04:15:26Z

backbone:
  # Phase-1 protocol isomorphic to E1/E2; capacity/budget from configs/tiny_imagenet.yaml.
  # Trained on official Tiny-ImageNet train only (post-download-authorization); never sees
  # candidate artifacts. PLAN ONLY in iter-0008: no 64px backbone retraining executed.
  latent_channels: 16
  width: 96
  embed_dim: 256
  ae_epochs: 100
  diffusion_epochs: 200
  ae_lr: 0.0002
  diffusion_lr: 0.0002
  batch_size: 128
  checkpoint: runs/tiny_imagenet/auditbench_e3/backbone.pt
  condition_dropout: 0.1
  semantic_weight: 0.1
  ema_decay: 0.999
  validation_fraction: 0.1
  validation_batches: 10
  noise_mse_target: 0.8
  use_ema: true

trajectory:
  diffusion_steps: 1000
  timesteps: [999, 749, 499, 249, 0]
  beta_start: 0.0001
  beta_end: 0.02
  space: latent
  direction: reverse
  conditioning: unconditional
  source: inversion
  representation: predicted_clean
  inference_steps: 100
  noise_repeats: 1

topology:
  max_points_per_class: 64
  signature_size: 32
  metric: cosine
  homology_dim: 0
  pairs_per_step: 4

distill:
  method: ttd
  ipc: 10
  steps: 2000
  lr: 0.05
  lambda_feature: 1.0
  lambda_topology: 1.0
  feature_covariance: true
  init: real
  log_every: 50

evaluation:
  # Frozen E3 student-training budget: identical to the E1/E2 frozen values
  # (200ep / batch 128 / lr 0.1 / wd 5e-4 / seeds [0,1,2]); carried over unchanged and not
  # re-tunable in the formal E3 round. 64px convergence calibration clause: see the
  # pre-registration training_budget.convergence_calibration_clause.
  architectures: [convnet, resnet18, vgg11, mobilenet_v2]
  epochs: 200
  batch_size: 128
  lr: 0.1
  weight_decay: 0.0005
  seeds: [0, 1, 2]
  probe_views: 8
  probe_max_iter: 500

feasibility:
  sample_count: 10000
  train_fraction: 0.8
  split_seeds: [0, 1, 2, 3, 4]
  topology_neighbors: 16
  topology_jobs: 1
  dimension_matched_probe: true
  visualization_samples: 500
  exact_ph_max_dim: 1
  topology_curve_bins: 50
